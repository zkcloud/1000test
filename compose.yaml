name: reading-platform
services:
  app:
    image: ${APP_IMAGE:-reading-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://43.155.140.75}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-43.155.140.75,127.0.0.1,localhost}
      COOKIE_SECURE: "1"
      ENABLE_API_DOCS: "0"
      APP_DATABASE: /var/lib/reading/practice.sqlite3
    volumes:
      - runtime-data:/var/lib/reading
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    networks:
      backend:
        ipv4_address: 172.30.50.3
    mem_limit: 512m
    cpus: 1.5
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-reading-nginx:local}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN,SETUID,SETGID,NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${NGINX_CONFIG:-./deploy/nginx/site.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${SHARED_DIR:-/opt/reading-platform/shared}/letsencrypt:/etc/letsencrypt:ro
      - ${SHARED_DIR:-/opt/reading-platform/shared}/acme:/var/www/certbot:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    networks:
      edge:
      backend:
        ipv4_address: 172.30.50.2
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  certbot:
    image: ${CERTBOT_IMAGE:-reading-certbot:local}
    build:
      context: .
      dockerfile: deploy/certbot/Dockerfile
    profiles: [tools]
    volumes:
      - ${SHARED_DIR:-/opt/reading-platform/shared}/letsencrypt:/etc/letsencrypt
      - ${SHARED_DIR:-/opt/reading-platform/shared}/acme:/var/www/certbot
      - ${SHARED_DIR:-/opt/reading-platform/shared}/certbot-log:/var/log/letsencrypt
    networks: [edge]
    logging: *logging

volumes:
  runtime-data:
    name: reading-platform-runtime
networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.50.0/24
